{% extends 'base.html' %}
{% block conteudo %}
<h2 class="center">Lista de Filmes</h2>
<hr> 
<div class="row">
    {% for filme in filmes %}
    <div class="col-md-3">
        <div class="card" style= "width:18rem;">
            <img src="http://image.tmdb.org/t/p/w500{{filme.backdrop_path}}" alt="card-img-top">
            <div class="card-body">
                <h5 class="card-title">{{filme.title}}</h5>
                <p class="card-text">{{filme.overview}}</p>
                <hr>
                <h4>Nota Média
                    <span class="badge bg-danger">{{filme.vote_average}}</span>
                </h4>
            </div>
        </div>
        
        
    </div>
    {% endfor %}
</div>

{% endblock conteudo %}
